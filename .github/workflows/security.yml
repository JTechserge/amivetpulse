name: Security

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Lundi 03h00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ── 1. Analyse statique CodeQL (JS/TS) ──────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ── 2. Détection de secrets (gitleaks) ──────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # historique complet pour scanner tous les commits

      - name: Scanner les secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Audit des dépendances npm ────────────────────────────────────────────
  # Seuils différenciés : seul ce qui part en production (jspdf, html2canvas et
  # leurs dépendances, dont dompurify) bloque dès la sévérité haute. Les outils
  # de dev (vite, vitest, eslint, http-server…) ne sont jamais servis à la
  # clinique : ils ne bloquent qu'en critique, et le reste est rapporté en
  # avertissement dans le résumé du job, sans faire tomber le build.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Audit production (bloquant dès haute sévérité)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complet (bloquant en critique)
        run: npm audit --audit-level=critical

      - name: Audit complet (rapport, non bloquant)
        if: always()
        run: |
          if ! npm audit --audit-level=high > audit.txt 2>&1; then
            echo "::warning title=npm audit::Vulnérabilités hautes en dépendances de dev — voir le résumé du job"
          fi
          {
            echo '### npm audit complet'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
